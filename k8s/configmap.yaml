apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-service-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-billing-service
    app.kubernetes.io/part-of: oficina
data:
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Issuer: Oficina.Api
  Jwt__Audience: Oficina.Api
  Jwt__ExpirationMinutes: "60"
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  Mongo__Database: oficina_billing
  MercadoPago__Modo: Fake
  MercadoPago__Sandbox: "true"
  # Proxy do Kong local da Fase 3 (NodePort 32080); a 4.4 roteia /billing no Kong.
  MercadoPago__PublicBaseUrl: http://localhost:32080/billing
  NEW_RELIC_APP_NAME: oficina-billing-service
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
