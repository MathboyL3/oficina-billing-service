# Copie para k8s/secret.yaml (ignorado no git), preencha e aplique: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-service-secrets
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__Mongo: "mongodb://billing-mongo-0.billing-mongo.oficina.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true"
  Jwt__Secret: "<jwt-secret-min-32-chars>"
  MercadoPago__AccessToken: "<mp-access-token>"
  MercadoPago__WebhookSecret: "<mp-webhook-secret>"
  NEW_RELIC_LICENSE_KEY: "<license-key>"
